<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="monetag" content="68f7305b4b2a77312b94d86b47c531ac">
    <title>What Is My IP?</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #ffffff;
        }

        .container {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 28px;
            padding: 40px 30px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 30px 50px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.1);
            text-align: center;
            transition: transform 0.3s ease;
        }

        .container:hover {
            transform: scale(1.01);
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 600;
            letter-spacing: 1px;
            margin-bottom: 8px;
            background: linear-gradient(to right, #a18cd1, #fbc2eb);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            font-size: 0.95rem;
            color: #b0b0d0;
            margin-bottom: 32px;
        }

        .ip-box {
            background: rgba(0, 0, 0, 0.35);
            border-radius: 18px;
            padding: 22px 20px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            word-break: break-all;
            position: relative;
        }

        .ip-label {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #a0a0c0;
            margin-bottom: 6px;
        }

        .ip-address {
            font-size: 2.4rem;
            font-weight: 700;
            font-family: 'Fira Code', 'Courier New', monospace;
            color: #ffffff;
            text-shadow: 0 0 12px rgba(161, 140, 209, 0.6);
            transition: all 0.2s;
        }

        .copy-btn {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.25);
            color: white;
            padding: 8px 20px;
            border-radius: 40px;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            margin-top: 14px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.3s;
            backdrop-filter: blur(10px);
        }

        .copy-btn:hover {
            background: rgba(255, 255, 255, 0.25);
            box-shadow: 0 0 20px rgba(161, 140, 209, 0.5);
            border-color: rgba(255, 255, 255, 0.5);
        }

        .copy-btn:active {
            transform: scale(0.96);
        }

        .details {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 18px;
            padding: 20px;
            margin-top: 10px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px 12px;
            text-align: left;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .detail-item {
            display: flex;
            flex-direction: column;
        }

        .detail-title {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            color: #a0a0c0;
            margin-bottom: 4px;
        }

        .detail-value {
            font-weight: 600;
            font-size: 1rem;
            color: #e0e0ff;
            word-break: break-word;
        }

        .loading-spinner {
            display: inline-block;
            width: 28px;
            height: 28px;
            border: 3px solid rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            border-top-color: #a18cd1;
            animation: spin 0.8s linear infinite;
            margin: 10px auto;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .error-message {
            color: #ff8a8a;
            background: rgba(255, 0, 0, 0.15);
            padding: 12px;
            border-radius: 12px;
            margin: 15px 0;
            font-size: 0.9rem;
        }

        .footer {
            font-size: 0.7rem;
            color: #7a7a9a;
            margin-top: 25px;
            letter-spacing: 0.5px;
        }

        @media (max-width: 400px) {
            .ip-address {
                font-size: 1.7rem;
            }
            .details {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌐 What Is My IP?</h1>
        <p class="subtitle">Your public IP address & location details</p>

        <div class="ip-box">
            <div class="ip-label">Your IP Address</div>
            <div class="ip-address" id="ipDisplay">
                <span class="loading-spinner" id="spinner"></span>
            </div>
            <button class="copy-btn" id="copyBtn" style="display: none;">
                📋 Copy IP
            </button>
        </div>

        <div id="detailsContainer" style="display: none;">
            <div class="details" id="detailsGrid"></div>
        </div>

        <div id="errorContainer" style="display: none;"></div>
        <div class="footer">Secure · Instant · No logs</div>
    </div>

    <script>
        (async function () {
            const ipDisplay = document.getElementById('ipDisplay');
            const spinner = document.getElementById('spinner');
            const copyBtn = document.getElementById('copyBtn');
            const detailsContainer = document.getElementById('detailsContainer');
            const detailsGrid = document.getElementById('detailsGrid');
            const errorContainer = document.getElementById('errorContainer');

            // Helper to show error
            function showError(message) {
                spinner.style.display = 'none';
                ipDisplay.textContent = '—';
                errorContainer.style.display = 'block';
                errorContainer.innerHTML = `<div class="error-message">⚠️ ${message}</div>`;
                copyBtn.style.display = 'none';
            }

            try {
                // Step 1: Get public IP from ipify (supports IPv4 & IPv6)
                const ipResponse = await fetch('https://api64.ipify.org?format=json');
                if (!ipResponse.ok) throw new Error('Failed to fetch IP address');
                const ipData = await ipResponse.json();
                const ip = ipData.ip;

                // Display IP
                spinner.style.display = 'none';
                ipDisplay.textContent = ip;
                copyBtn.style.display = 'inline-flex';

                // Copy functionality
                copyBtn.addEventListener('click', () => {
                    navigator.clipboard.writeText(ip).then(() => {
                        const originalText = copyBtn.innerHTML;
                        copyBtn.innerHTML = '✅ Copied!';
                        copyBtn.disabled = true;
                        setTimeout(() => {
                            copyBtn.innerHTML = originalText;
                            copyBtn.disabled = false;
                        }, 2000);
                    }).catch(() => {
                        alert('Could not copy IP. Please copy manually.');
                    });
                });

                // Step 2: Fetch location details using ipapi.co (free, no key needed)
                try {
                    const geoResponse = await fetch(`https://ipapi.co/${ip}/json/`);
                    if (!geoResponse.ok) throw new Error('Location fetch failed');
                    const geoData = await geoResponse.json();

                    if (geoData.error) {
                        // Still show something, like just the IP
                        throw new Error(geoData.reason || 'Location unavailable');
                    }

                    // Build details grid
                    const fields = [
                        { title: 'City', value: geoData.city || '—' },
                        { title: 'Region', value: geoData.region || '—' },
                        { title: 'Country', value: geoData.country_name || '—' },
                        { title: 'ISP', value: geoData.org || '—' },
                        { title: 'Postal', value: geoData.postal || '—' },
                        { title: 'Timezone', value: geoData.timezone || '—' },
                        { title: 'Coordinates', value: geoData.latitude && geoData.longitude ? `${geoData.latitude}, ${geoData.longitude}` : '—' },
                        { title: 'ASN', value: geoData.asn || '—' }
                    ];

                    detailsGrid.innerHTML = fields.map(f =>
                        `<div class="detail-item">
                            <span class="detail-title">${f.title}</span>
                            <span class="detail-value">${f.value}</span>
                        </div>`
                    ).join('');

                    detailsContainer.style.display = 'block';

                } catch (geoError) {
                    // If geo lookup fails, we still have the IP displayed; just show a note
                    detailsContainer.style.display = 'block';
                    detailsGrid.innerHTML = `<div class="detail-item" style="grid-column: span 2; text-align: center; color: #b0b0d0;">
                        📍 Location details temporarily unavailable
                    </div>`;
                    console.warn('Geo IP lookup error:', geoError);
                }

            } catch (err) {
                showError('Unable to detect your IP. Please check your connection and try again.');
                console.error(err);
            }
        })();
    </script>

    <script src="https://quge5.com/88/tag.min.js" data-zone="236549" async data-cfasync="false"></script>
</body>
</html>
